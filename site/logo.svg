<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Debug Anything mark: a lens looking at a live process trace. Evidence, not guesses. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ad4ff"/>
      <stop offset="1" stop-color="#5aa9f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lens"><circle cx="256" cy="256" r="150"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- faint grid = the system -->
  <g stroke="#1e2638" stroke-width="2">
    <path d="M96 256H416M256 96V416"/>
    <circle cx="256" cy="256" r="196" fill="none"/>
  </g>
  <!-- lens ring -->
  <circle cx="256" cy="256" r="150" fill="#0e1422" stroke="url(#ring)" stroke-width="22"/>
  <!-- the live trace inside the lens -->
  <g clip-path="url(#lens)">
    <path d="M60 268 L160 268 L185 268 L205 200 L225 340 L245 150 L262 372 L280 268 L320 268 L340 226 L358 300 L372 268 L460 268"
          fill="none" stroke="#ffb86b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- cursor dot: "right now" -->
    <circle cx="372" cy="268" r="14" fill="#ffd9ad"/>
  </g>
  <!-- lens handle / aperture tick -->
  <path d="M362 362 L426 426" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"/>
</svg>
