  </g>
  <path d="M332 407 L388 463" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"/>
  <text x="470" y="262" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-3" fill="#eef2f8">Debug Anything</text>
  <text x="472" y="320" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#9aa0ad">eyes on running software, for your agent</text>
