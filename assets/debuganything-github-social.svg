    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ad4ff"/><stop offset="1" stop-color="#5aa9f0"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="lens"><circle cx="240" cy="315" r="130"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
