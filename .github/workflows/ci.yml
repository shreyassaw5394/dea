name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Smoke CLI
        run: node dist/cli.js readiness --json | head -c 4000
      - name: Pack dry run
        run: npm pack --dry-run
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python SDK tests
        run: cd python && pip install -e . pytest && python -m pytest -q tests
