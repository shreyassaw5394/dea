name: Publish Python package to PyPI

on:
  push:
    tags: ["py-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # trusted publishing (configure the publisher on pypi.org for this repo/workflow)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build pytest
      - run: cd python && pytest -q tests && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # If you prefer a token over trusted publishing, add secret PYPI_TOKEN and uncomment:
          # password: ${{ secrets.PYPI_TOKEN }}
