name: Deploy site (Vercel)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "assets/**", "README.md", "vercel.json", "scripts/build-site.sh", ".github/workflows/deploy-vercel.yml"]
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://debuganything.dev
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g vercel@latest
      # Remote build on Vercel (same path as `vercel deploy --prod` from a laptop); vercel.json holds the build settings.
      - run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
