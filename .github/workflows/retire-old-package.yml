name: Retire old npm package
on:
  workflow_dispatch:
    inputs:
      package:
        description: "package to unpublish"
        required: true
        default: "dea-agents"
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Unpublish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
          npm unpublish "${{ inputs.package }}" --force
          echo "unpublished ${{ inputs.package }}"
