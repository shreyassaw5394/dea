version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { dev: { dependency-type: development }, prod: { dependency-type: production } }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /python
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
