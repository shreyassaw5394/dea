[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debuganything"
version = "1.0.0"
description = "Debug Anything from Python agents: observe running processes (strace, py-spy, perf, lsof, tcpdump, gdb/lldb, heap snapshots) and get evidence-backed findings. Wraps the Debug Anything CLI/MCP server; tool adapters for LangChain, LlamaIndex and CrewAI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Shreyas Sawant" }]
keywords = ["debugging", "observability", "profiling", "agents", "mcp", "langchain", "llamaindex", "crewai", "strace", "py-spy", "perf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2", "pydantic>=2"]
llamaindex = ["llama-index-core>=0.10"]
crewai = ["crewai>=0.30", "pydantic>=2"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/shreyassaw5394/debuganything"
Documentation = "https://github.com/shreyassaw5394/debuganything/tree/main/docs"
Issues = "https://github.com/shreyassaw5394/debuganything/issues"

[tool.hatch.build.targets.wheel]
packages = ["debuganything"]
